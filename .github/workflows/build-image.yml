name: Build & Publish Docker Image

on:
  push:
    branches: [ main ]       # Se ejecuta en cada push a main
  workflow_dispatch:         # Permite ejecutar manualmente desde Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: servidor-provisioning

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # Permiso necesario para publicar en GHCR

    steps:
      # 1️⃣ Clonar el repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Buildx para builds multi-plataforma
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Loguearse en GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4️⃣ Construir y publicar la imagen
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                  # Ruta del Dockerfile
          push: true                  # Publica la imagen en GHCR
          tags: ${{ env.REGISTRY }}/eugelocos/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
